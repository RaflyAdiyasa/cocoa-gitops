apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest

          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"

          ports:
            - name: api
              containerPort: 9000

            - name: console
              containerPort: 9001

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: MINIO_ACCESSKEY

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: MINIO_SECRETKEY

          volumeMounts:
            - name: minio-storage
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20

          resources:
              limits:
                memory: "812Mi"
                cpu: "300m"
              requests:
                memory: "256Mi"
                cpu: "200m"


      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: minio-pvc