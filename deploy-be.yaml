apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdeskcocoa-api
spec:
  replicas: 1

  selector:
    matchLabels:
      app: helpdeskcocoa-api

  template:
    metadata:
      labels:
        app: helpdeskcocoa-api

    spec:

      initContainers:

        - name: wait-for-mysql
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."

              until nc -z svc-mysql 3306; do
                echo "MySQL not ready..."
                sleep 2
              done

              echo "MySQL reachable"


        - name: wait-for-redis
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."

              until nc -z svc-redis 6379; do
                echo "Redis not ready..."
                sleep 2
              done

              echo "Redis reachable"


        - name: wait-for-minio
          image: busybox:1.36

          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO..."

              until nc -z svc-minio 9000; do
                echo "MinIO not ready..."
                sleep 2
              done

              echo "MinIO reachable"


      containers:

        - name: api
          image: huan271/cocoa:5
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "812Mi"
              cpu: "300m"
            requests:
              memory: "256Mi"
              cpu: "200m"

          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: svc-mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: JWT_SECRET

            - name: MINIO_ENDPOINT
              value: svc-minio:9000

            - name: MINIO_PUBLIC_ENDPOINT
              value: localhost:9000

            - name: MINIO_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: MINIO_ACCESSKEY

            - name: MINIO_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: MINIO_SECRETKEY

            - name: MINIO_BUCKETNAME
              valueFrom:
                secretKeyRef:
                  name: helpdeskcocoa-secret
                  key: MINIO_BUCKETNAME

            - name: REDIS_ENDPOINT
              value: svc-redis:6379

            - name: REDIS_DB
              value: "8"

          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080

            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20

          livenessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5